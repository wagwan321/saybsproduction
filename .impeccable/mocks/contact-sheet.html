<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact sheet sketch</title>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Jost:wght@300..500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#0a0a0a;color:#fff;font-family:Jost,sans-serif}
nav{position:absolute;top:34px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.32em;text-transform:uppercase}
nav .links{display:flex;gap:40px}
.brand{text-align:center}
.brand h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:30px;letter-spacing:.3em}
.paper{position:absolute;left:56px;top:120px;width:760px;height:720px;background:#fff;padding:26px}
.paper img{width:100%;height:100%;object-fit:cover;display:block}
.strip{position:absolute;left:880px;top:120px;width:500px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#141414;padding:30px 18px}
.fr{position:relative;aspect-ratio:3/4;overflow:visible}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr span{position:absolute;left:0;bottom:-16px;font-size:9px;letter-spacing:.2em;color:#cfcfcf}
.fr.on:after{content:"";position:absolute;inset:-10px;border:2px solid #fff;border-radius:46% 52% 44% 56%;transform:rotate(-3deg)}
.cap{position:absolute;left:880px;bottom:60px;width:500px;font-size:13px;line-height:1.7}
.cap b{display:block;font-family:'Bodoni Moda',serif;font-weight:400;font-size:28px}
.cap a{display:inline-block;margin-top:12px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;border-bottom:1px solid;padding-bottom:3px}
</style></head><body>

</div>
